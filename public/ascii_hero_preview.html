<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ASCII Hero — Pranav Ghadigaonkar</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:crosshair}

/* ── ASCII canvas layer ── */
#ascii-canvas{
  position:absolute;inset:0;
  font-family:'Space Mono',monospace;
  font-size:11px;
  line-height:1.18;
  letter-spacing:0.06em;
  white-space:pre;
  color:#fff;
  pointer-events:none;
  overflow:hidden;
}

/* ── Vignette — asymmetric, heavier on the right to push eye left ── */
#vignette{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 90% at 72% 50%, transparent 25%, rgba(0,0,0,0.78) 100%),
    linear-gradient(to right, rgba(0,0,0,0.55) 0%, transparent 38%, transparent 58%, rgba(0,0,0,0.72) 100%);
  pointer-events:none;
}

/* ── Scanlines ── */
#scanlines{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,transparent 2px,
    rgba(0,0,0,0.035) 2px,rgba(0,0,0,0.035) 3px
  );
  pointer-events:none;
}

/* ── Hero content — left aligned ── */
#content{
  position:absolute;inset:0;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  text-align:left;
  padding-left: clamp(32px, 7vw, 96px);
  padding-right: clamp(32px, 4vw, 48px);
  padding-top: clamp(24px, 4vh, 48px);
  padding-bottom: clamp(24px, 4vh, 48px);
  gap: clamp(14px, 2.2vw, 26px);
}

.eyebrow{
  font-family:'Space Mono',monospace;
  font-size:9.5px;
  letter-spacing:0.32em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.28);
  display:flex;
  align-items:center;
  gap:14px;
}
/* only left tick */
.eyebrow::before{
  content:'';display:block;
  width:28px;height:1px;
  background:rgba(255,255,255,0.15);
}

h1{
  font-family:'DM Serif Display',serif;
  font-weight:400;
  font-size:clamp(3.2rem,8.5vw,8.4rem);
  line-height:0.91;
  letter-spacing:-0.025em;
  color:#fff;
  text-shadow:
    0 0 100px rgba(0,0,0,0.95),
    0 0 50px rgba(0,0,0,0.9),
    0 0 24px rgba(0,0,0,0.8);
  max-width: 14ch;
}
h1 em{
  font-style:italic;
  color:rgba(255,255,255,0.62);
}

.sub{
  font-family:'Inter',sans-serif;
  font-size:clamp(12px,1.35vw,15px);
  font-weight:300;
  color:rgba(255,255,255,0.3);
  letter-spacing:0.07em;
  line-height:1.65;
}

/* separator — a short horizontal rule that echoes the waveform */
.rule{
  width:clamp(32px,5vw,56px);
  height:1px;
  background:rgba(255,255,255,0.12);
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:4px;
}
.btn-p{
  font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.2em;
  text-transform:uppercase;text-decoration:none;
  color:#000;background:#fff;
  padding:12px 26px;border:1px solid #fff;
  cursor:pointer;transition:box-shadow .2s;
}
.btn-p:hover{box-shadow:0 0 32px rgba(255,255,255,0.22)}
.btn-g{
  font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.2em;
  text-transform:uppercase;text-decoration:none;
  color:rgba(255,255,255,0.38);background:transparent;
  padding:12px 26px;border:1px solid rgba(255,255,255,0.13);
  cursor:pointer;transition:color .15s,border-color .15s;
}
.btn-g:hover{color:#fff;border-color:rgba(255,255,255,0.38)}

/* scroll hint */
.scroll-hint{
  position:absolute;bottom:26px;
  left: clamp(32px, 7vw, 96px);
  font-family:'Space Mono',monospace;font-size:8.5px;letter-spacing:0.3em;
  text-transform:uppercase;color:rgba(255,255,255,0.18);
  animation:scrollblink 3.2s ease-in-out infinite;
}
@keyframes scrollblink{
  0%,100%{color:rgba(255,255,255,0.12)}
  50%{color:rgba(255,255,255,0.38)}
}
</style>
</head>
<body>

<div id="ascii-canvas"></div>
<div id="vignette"></div>
<div id="scanlines"></div>

<div id="content">
  <p class="eyebrow">Pranav Ghadigaonkar — Est. 2022</p>
  <h1>Life is a paradox,<br><em>so is Art.</em></h1>
  <div class="rule"></div>
  <p class="sub">AI/ML Engineer · Graphic Designer · Photographer</p>
  <div class="actions">
    <a href="#" class="btn-p">View Work</a>
    <a href="#" class="btn-g">Get in Touch</a>
  </div>
</div>

<p class="scroll-hint">▾ scroll</p>

<script>
const el = document.getElementById('ascii-canvas')
const RAMP = " .`':;-~=+*?!ilI1tfjrxncuvzXYUJCLQ0OZmwqpdbkhao*#MW&8%B@"

let COLS, ROWS, CW, CH
let t = 0
let aspect = 1

function hash(n) { return Math.abs((Math.sin(n * 127.1 + 311.7) * 43758.5453) % 1) }
function fract(x) { return x - Math.floor(x) }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y)
  const fx = fract(x), fy = fract(y)
  const ux = fx*fx*(3-2*fx), uy = fy*fy*(3-2*fy)
  const a = hash(ix   + iy    *57), b = hash(ix+1 + iy    *57)
  const c = hash(ix   + (iy+1)*57), d = hash(ix+1 + (iy+1)*57)
  return (a + (b-a)*ux + (c-a)*uy + (a-b-c+d)*ux*uy) * 2 - 1
}
function smoothstep(x) { x=Math.max(0,Math.min(1,x)); return x*x*(3-2*x) }

// ── CHAOS ──
const CHAOS = [
  { bx:0.22, by:0.65, freq:9.5,  speed:0.72, phase:0,           driftR:0.13, driftSpeed:0.17, driftAngle:0 },
  { bx:0.78, by:0.30, freq:11.2, speed:0.88, phase:Math.PI*0.7, driftR:0.10, driftSpeed:0.23, driftAngle:Math.PI*0.8 },
  { bx:0.58, by:0.74, freq:7.8,  speed:0.55, phase:Math.PI*1.4, driftR:0.14, driftSpeed:0.13, driftAngle:Math.PI*1.6 },
]
function chaosField(nx, ny, time) {
  const ax = nx * aspect
  let total = 0
  for (const s of CHAOS) {
    const sa = s.driftAngle + time * s.driftSpeed
    const px = (s.bx + Math.cos(sa)*s.driftR) * aspect
    const py =  s.by + Math.sin(sa)*s.driftR
    const dist = Math.sqrt((ax-px)**2 + (ny-py)**2)
    const amp  = 1.0 / (1.0 + dist * 4.2)
    total += amp * Math.sin(s.freq * Math.PI*2 * dist - s.speed * time + s.phase)
  }
  return total / 2.2
}

// ── RIPPLE ──
// Physics: each ripple is a single ring born at radius=0 at the cursor.
// The ring's radius grows linearly with age: r_ring = EXPAND_SPEED * age
// A pixel lights up when its distance from origin ≈ r_ring.
// Ring thickness stays constant; amplitude fades as it expands (energy spreads).
// Multiple ripples can coexist — each born at a different point and time.

const EXPAND_SPEED = 0.22    // how fast the ring radius grows (normalised units/s)
const RING_THICK   = 0.018   // half-thickness of the ring band
const MAX_RADIUS   = 0.52    // ring dies when it reaches this size
const RIPPLE_LIFE  = MAX_RADIUS / EXPAND_SPEED  // auto-computed lifetime

const ripples = []

function spawnRipple(x, y) {
  // Avoid spawning duplicate at same spot within a short window
  for (const r of ripples) {
    const dx = r.x - x, dy = r.y - y
    if (Math.sqrt(dx*dx+dy*dy) < 0.015 && (t - r.born) < 0.18) return
  }
  if (ripples.length >= 8) ripples.shift()
  ripples.push({ x, y, born: t })
}

function rippleField(rip, nx, ny, time) {
  const age = time - rip.born
  if (age < 0) return 0

  // Current ring radius — grows from 0
  const ringR = EXPAND_SPEED * age
  if (ringR > MAX_RADIUS) return 0

  // Distance from this pixel to ripple origin (aspect corrected)
  const ax = (nx - rip.x) * aspect
  const ay = (ny - rip.y)
  const pixR = Math.sqrt(ax*ax + ay*ay)

  // How close is this pixel to the ring edge?
  const delta = Math.abs(pixR - ringR)
  if (delta > RING_THICK * 2.5) return 0   // outside band entirely — skip

  // Soft Gaussian band centred on the ring radius
  const band = Math.exp(-(delta * delta) / (RING_THICK * RING_THICK))

  // Amplitude fades as ring expands — energy conserved over larger circumference
  // Also fades toward end of life so it dissolves rather than hard-cuts
  const lifeFrac = ringR / MAX_RADIUS          // 0 at birth, 1 at death
  const energyFade = Math.pow(1.0 - lifeFrac, 1.4)

  // Inner clarity — tiny radius means ring is tightly defined, looks sharp at start
  const inner = smoothstep(ringR / 0.01)

  return band * energyFade * inner * 1.8
}

// ── Cursor ──
let mouse = { x: -1, y: -1 }

// ── Resize ──
function resize() {
  const W = window.innerWidth, H = window.innerHeight
  const tmp = document.createElement('span')
  tmp.style.cssText = 'font-family:Space Mono,monospace;font-size:11px;line-height:1.18;letter-spacing:0.06em;position:absolute;visibility:hidden;white-space:pre'
  tmp.textContent = 'X'
  document.body.appendChild(tmp)
  CW = tmp.offsetWidth  || 7.2
  CH = tmp.offsetHeight || 13
  document.body.removeChild(tmp)
  COLS = Math.ceil(W / CW) + 1
  ROWS = Math.ceil(H / CH) + 1
  aspect = (COLS * CW) / (ROWS * CH)
  el.style.width  = W + 'px'
  el.style.height = H + 'px'
}

// ── Render ──
let lastTime = 0
function render(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05)
  lastTime = ts
  t += dt * 0.48

  // Purge dead ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    if ((t - ripples[i].born) > RIPPLE_LIFE + 0.1) ripples.splice(i, 1)
  }

  const RL = RAMP.length - 1
  const lines = []

  for (let row = 0; row < ROWS; row++) {
    const ny = row / ROWS
    let line = ''
    for (let col = 0; col < COLS; col++) {
      const nx = col / COLS

      let w = chaosField(nx, ny, t)

      for (const rip of ripples) {
        w += rippleField(rip, nx, ny, t)
      }

      w += noise2(nx*9 + t*0.06, ny*9 + t*0.05) * 0.03

      const d = Math.pow(Math.min(1, Math.abs(w)), 0.62)
      line += RAMP[Math.round(d * RL)]
    }
    lines.push(line)
  }

  el.textContent = lines.join('\n')
  requestAnimationFrame(render)
}

// ── Events ──
window.addEventListener('resize', resize)

window.addEventListener('mousemove', e => {
  const nx = e.clientX / window.innerWidth
  const ny = e.clientY / window.innerHeight
  const dx = nx - mouse.x, dy = ny - mouse.y
  mouse.x = nx; mouse.y = ny
  // Spawn on meaningful movement — gives ripple-per-gesture feel
  if (Math.sqrt(dx*dx+dy*dy) > 0.009) spawnRipple(nx, ny)
})

window.addEventListener('click', e => {
  // Click always spawns a fresh ripple — tap the water
  spawnRipple(e.clientX / window.innerWidth, e.clientY / window.innerHeight)
})

window.addEventListener('mouseenter', e => {
  mouse.x = e.clientX / window.innerWidth
  mouse.y = e.clientY / window.innerHeight
  spawnRipple(mouse.x, mouse.y)
})

resize()
requestAnimationFrame(ts => { lastTime = ts; render(ts) })
</script>
</body>
</html>
